[package]
name = "nanoscope"
version = "0.1.0"
edition = "2021"
description = "Lossless image compression research rig"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Portable release build: no target-cpu=native on purpose (results must be reproducible
# across machines; revisit per-experiment if SIMD tuning is ever the hypothesis).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

# Experiment and benchmark binaries live outside src/bin; targets keep their original names (cargo run --bin <name>).
# serve stays in src/bin and is auto-discovered.

[[bin]]
name = "bench"
path = "experiments/bin/bench.rs"

[[bin]]
name = "bench_lisa1"
path = "experiments/bin/bench_lisa1.rs"

