[package]
name = "nanoscope"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
